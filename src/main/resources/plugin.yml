name: RPGFramework
version: '${version}'
main: io.github.math0898.rpgframework.RPGFramework
api-version: '26.2'
authors: [Sugaku, Cybellereaper, AliceBlackRose]
description: Modern Paper 26.2 RPG framework rewritten for Java 25.
prefix: RPG Framework
load: POSTWORLD
permissions:
  rpg.player:
    default: true
  rpg.classes:
    default: true
  rpg.parties:
    default: true
  rpg.stats:
    default: true
  rpg.tutorial:
    default: true
  rpg.updates:
    default: true
  rpg.artifact:
    default: true
  rpg.admin:
    default: op
  rpg.beta:
    default: op
  rpg.parties.maxbypass:
    default: op
