name: RPGFramework
version: '${version}'
main: io.github.math0898.rpgframework.RPGFramework
api-version: '26.2'
authors: [Sugaku, Cybellereaper, AliceBlackRose]
description: Java 25 / Paper 26.2 RPG framework prototype.
prefix: RPG Framework
load: POSTWORLD
permissions:
  rpg.player:
    default: true
  rpg.classes:
    default: true
  rpg.parties:
    default: true
  rpg.stats:
    default: true
  rpg.admin:
    default: op
  rpg.parties.maxbypass:
    default: op
